<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="LaunchPilot — your AI copilot from zero to your first freelance paycheck, anywhere in the world">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#131a24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.45" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#233043" stroke-width="1" opacity="0.5">
    <path d="M0 84 H1280 M0 170 H1280 M0 256 H1280"/>
    <path d="M320 0 V340 M640 0 V340 M960 0 V340"/>
  </g>
  <ellipse cx="640" cy="150" rx="520" ry="150" fill="url(#halo)">
    <animate attributeName="rx" values="500;540;500" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- glowing rocket accent -->
  <g transform="translate(150,150)" filter="url(#glow)">
    <path d="M0 -46 C 22 -30 30 -6 22 22 L -22 22 C -30 -6 -22 -30 0 -46 Z" fill="url(#neon)"/>
    <circle cx="0" cy="-8" r="9" fill="#0a0e14"/>
    <path d="M-22 22 l-14 24 22 -8 Z M22 22 l14 24 -22 -8 Z" fill="#FF7A18"/>
    <path d="M-6 30 q6 26 6 40 q0 -14 6 -40 Z" fill="#FFD98A">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="250" y="168" font-size="94" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="-2">
      LaunchPilot
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="252" y="214" font-size="25" font-weight="600" fill="#9fb3c8" letter-spacing="0.5">
      Your AI copilot from zero to your first freelance paycheck — anywhere.
    </text>
    <g font-size="16" font-weight="600">
      <rect x="252" y="244" width="150" height="34" rx="17" fill="#1c2735" stroke="#2c3a4d"/>
      <text x="327" y="266" fill="#F5A524" text-anchor="middle">Advisory-only</text>
      <rect x="414" y="244" width="132" height="34" rx="17" fill="#1c2735" stroke="#2c3a4d"/>
      <text x="480" y="266" fill="#7ee0c0" text-anchor="middle">Multilingual</text>
      <rect x="558" y="244" width="140" height="34" rx="17" fill="#1c2735" stroke="#2c3a4d"/>
      <text x="628" y="266" fill="#8ab4ff" text-anchor="middle">Open source</text>
    </g>
  </g>
</svg>
